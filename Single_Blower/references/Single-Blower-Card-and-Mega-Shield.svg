<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1580" viewBox="0 0 1200 1580">
  <defs>
    <style>
      .title { font: 700 30px Arial, sans-serif; fill: #172033; }
      .date { font: 700 16px Arial, sans-serif; fill: #536078; text-anchor: end; }
      .subtitle { font: 16px Arial, sans-serif; fill: #536078; }
      .board { fill: #eef4fb; stroke: #2457c5; stroke-width: 4; }
      .conn { fill: #ffffff; stroke: #2457c5; stroke-width: 3; }
      .inner { fill: none; stroke: #8290a8; stroke-width: 2; stroke-dasharray: 8 7; }
      .hole { fill: #ffffff; stroke: #2457c5; stroke-width: 3; }
      .box-head { font: 700 13px Arial, sans-serif; fill: #172033; text-anchor: middle; }
      .box-body { font: 11px Arial, sans-serif; fill: #364258; text-anchor: middle; }
      .box-small { font: 10px Arial, sans-serif; fill: #364258; text-anchor: middle; }
      .box-tiny { font: 9px Arial, sans-serif; fill: #364258; text-anchor: middle; }
      .part-link { font: 10px Arial, sans-serif; fill: #2457c5; text-anchor: middle; text-decoration: underline; }
      .part-link-small { font: 9px Arial, sans-serif; fill: #2457c5; text-anchor: middle; text-decoration: underline; }
      .part-no { font: 700 10px Arial, sans-serif; fill: #26344d; text-anchor: middle; }
      .tbd { font: 700 10px Arial, sans-serif; fill: #a24916; text-anchor: middle; }
      .callout { fill: #ffffff; stroke: #b6c1d1; stroke-width: 2; rx: 10; }
      .call-head { font: 700 17px Arial, sans-serif; fill: #172033; }
      .call-body { font: 15px Arial, sans-serif; fill: #364258; }
      .leader { fill: none; stroke: #66758f; stroke-width: 2; }
      .dim { fill: none; stroke: #172033; stroke-width: 2; marker-start: url(#arrow); marker-end: url(#arrow); }
      .ext { stroke: #66758f; stroke-width: 1.5; }
      .dimtext { font: 700 17px Arial, sans-serif; fill: #172033; text-anchor: middle; }
      .note { font: 14px Arial, sans-serif; fill: #536078; }
      .panel-plane { fill: none; stroke: #c45a18; stroke-width: 3; stroke-dasharray: 10 6; }
      .panel-head { font: 700 16px Arial, sans-serif; fill: #8b3f12; }
      .panel-body { font: 14px Arial, sans-serif; fill: #364258; }
      .section-rule { stroke: #c9d2e2; stroke-width: 2; }
      .section-title { font: 700 24px Arial, sans-serif; fill: #172033; }
      .section-subtitle { font: 14px Arial, sans-serif; fill: #536078; }
      .function-card { fill: #ffffff; stroke: #9eacc1; stroke-width: 2; rx: 12; }
      .function-head { font: 700 17px Arial, sans-serif; fill: #2457c5; }
      .function-body { font: 14px Arial, sans-serif; fill: #364258; }
      .shield-card { fill: #eef4fb; stroke: #2457c5; stroke-width: 3; rx: 12; }
      .shield-head { font: 700 18px Arial, sans-serif; fill: #172033; }
      .shield-body { font: 14px Arial, sans-serif; fill: #364258; }
      .signal-label { font: 700 13px Arial, sans-serif; fill: #ffffff; text-anchor: middle; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto-start-reverse">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#172033"/>
    </marker>
  </defs>

  <rect width="1200" height="1580" fill="#f7f9fc"/>
  <text x="60" y="55" class="title">Single Blower Card and Mega Shield</text>
  <text x="1140" y="55" class="date">Date: 8-14-26</text>
  <text x="60" y="84" class="subtitle">Top view • connector part numbers and locations • board envelope shown at 55 × 65 mm maximum</text>

  <!-- Board: 550 × 650 px represents 55 × 65 mm -->
  <rect x="325" y="175" width="550" height="650" class="board"/>

  <!-- Connector footprints -->
  <rect x="335" y="115" width="155" height="115" class="conn"/>
  <text x="412.5" y="136" class="box-head">SENSOR CONNECTION</text>
  <text x="412.5" y="153" class="box-small">E18-D80NK • 3-position</text>
  <a href="https://www.digikey.com/en/products/detail/phoenix-contact/1923762/4388392?s=N4IgTCBcDaIIwE4wGYDsA2CBdAvkA" target="_blank">
    <text x="412.5" y="170" class="part-link">PCB HEADER PN 1923762</text>
  </a>
  <a href="https://www.digikey.com/en/products/detail/phoenix-contact/1911868/2511305?s=N4IgTCBcDaIIwE45wBwDYUgLoF8g" target="_blank">
    <text x="412.5" y="187" class="part-link">MATING PLUG PN 1911868</text>
  </a>
  <text x="412.5" y="204" class="box-small">Phoenix MSTB 2,5 HC • 5 mm</text>
  <a href="https://www.allelcoelec.com/blog/A-Complete-Guide-to-the-E18-D80NK-Adjustable-IR-Sensor.html?srsltid=AfmBOopl5XJ-yGQB4ck2zJEDLPveXuifAkWw2hS7cpf6SH57fcbR5w7b" target="_blank">
    <text x="412.5" y="220" class="part-link">SENSOR SOURCE LINK</text>
  </a>

  <rect x="510" y="115" width="180" height="115" class="conn"/>
  <text x="600" y="145" class="box-head">D-SUB CONNECTOR</text>
  <text x="600" y="169" class="tbd">PCB CONNECTOR PN: TBD</text>
  <text x="600" y="188" class="tbd">MATING CONNECTOR PN: TBD</text>
  <text x="600" y="207" class="box-small">Pin / shell / gender: TBD</text>

  <rect x="710" y="115" width="155" height="115" class="conn"/>
  <text x="787.5" y="136" class="box-head">LIMIT SWITCH</text>
  <text x="787.5" y="153" class="box-small">Snap Action Lever • 2-position</text>
  <a href="https://www.mcmaster.com/7658K15/" target="_blank">
    <text x="787.5" y="170" class="part-link">SWITCH PN 7658K15 • LINK</text>
  </a>
  <a href="https://www.digikey.com/en/products/detail/phoenix-contact/1923759/4388391?s=N4IgTCBcDaIIwE4wGYDsBWBIC6BfIA" target="_blank">
    <text x="787.5" y="187" class="part-link">PCB HEADER PN 1923759</text>
  </a>
  <a href="https://www.digikey.com/en/products/detail/phoenix-contact/1911855/2511299?s=N4IgTCBcDaIIwE45wBwFY0gLoF8g" target="_blank">
    <text x="787.5" y="204" class="part-link">MATING PLUG PN 1911855</text>
  </a>
  <text x="787.5" y="220" class="box-small">Phoenix MSTB 2,5 HC • 5 mm</text>

  <!-- Finished panel plane: mating faces of all top-row connectors align here -->
  <path d="M325 115 L875 115" class="panel-plane"/>

  <rect x="28" y="180" width="245" height="176" class="callout"/>
  <text x="47" y="211" class="panel-head">PANEL MOUNTING</text>
  <text x="47" y="239" class="panel-body">Mount PCB behind back wall.</text>
  <text x="47" y="264" class="panel-body">Top-row connector mating</text>
  <text x="47" y="286" class="panel-body">faces must be flush with the</text>
  <text x="47" y="308" class="panel-body">finished back-wall surface.</text>
  <text x="47" y="337" class="panel-body">Set standoff depth to suit.</text>
  <path d="M273 246 L285 246 L325 115" class="leader"/>

  <rect x="375" y="775" width="220" height="118" class="conn"/>
  <text x="485" y="796" class="box-head">LED CONNECTION</text>
  <text x="485" y="813" class="box-small">Dialight 5580101027F</text>
  <a href="https://www.digikey.com/en/products/detail/dialight/5580101027F/3464078" target="_blank">
    <text x="485" y="830" class="part-link">DigiKey 350-2956-ND • LINK</text>
  </a>
  <a href="https://www.digikey.com/en/products/detail/te-connectivity-amp-connectors/640457-2/109016" target="_blank">
    <text x="485" y="847" class="part-link">PCB HEADER PN TE 640457-2</text>
  </a>
  <a href="https://www.digikey.com/en/products/category/rectangular-connectors/2027?s=N4IgTCBcDaIGwBYAMCCsB2AtAkBdAvkA" target="_blank">
    <text x="485" y="864" class="part-link-small">MTA-100 MATE: PN TBD • OPTIONS</text>
  </a>
  <text x="485" y="881" class="box-tiny">2-position • right-angle • mate by wire gauge</text>

  <rect x="605" y="775" width="260" height="118" class="conn"/>
  <text x="735" y="796" class="box-head">BLOWER CONNECTION</text>
  <text x="735" y="813" class="box-small">Delta BFB0712HH-AWPH</text>
  <a href="https://www.digikey.com/en/products/detail/delta-electronics/BFB0712HH-AWPH/13997125?s=N4IgTCBcDaIGwAYDMBaAQgMTQg7ARjAAlCUBBAdQAUSA5AERAF0BfIA" target="_blank">
    <text x="735" y="830" class="part-link">DigiKey 603-BFB0712HH-AWPH-ND • LINK</text>
  </a>
  <a href="https://www.digikey.com/en/products/detail/te-connectivity-amp-connectors/640457-4/109019" target="_blank">
    <text x="735" y="847" class="part-link">PCB HEADER PN TE 640457-4</text>
  </a>
  <a href="https://www.digikey.com/en/products/category/rectangular-connectors/2027?s=N4IgTCBcDaIGwBYAMCCsB2AtAkBdAvkA" target="_blank">
    <text x="735" y="864" class="part-link-small">MTA-100 MATE: PN TBD • OPTIONS</text>
  </a>
  <text x="735" y="881" class="box-tiny">4-position • right-angle • mate by wire gauge</text>

  <!-- Existing center feature and mounting holes -->
  <rect x="405" y="410" width="390" height="190" class="inner"/>
  <circle cx="380" cy="275" r="17" class="hole"/>
  <circle cx="820" cy="275" r="17" class="hole"/>
  <circle cx="380" cy="725" r="17" class="hole"/>
  <circle cx="820" cy="725" r="17" class="hole"/>

  <rect x="28" y="390" width="245" height="104" class="callout"/>
  <text x="47" y="419" class="call-head">Mounting Holes</text>
  <text x="47" y="446" class="call-body">4× Ø3.6 mm THRU</text>
  <text x="47" y="471" class="call-body">Clearance for M3 screws</text>
  <path d="M273 446 L315 446 L370 420 L380 292" class="leader"/>

  <!-- Dimensions -->
  <line x1="325" y1="748" x2="325" y2="778" class="ext"/>
  <line x1="875" y1="748" x2="875" y2="778" class="ext"/>
  <line x1="345" y1="763" x2="855" y2="763" class="dim"/>
  <rect x="532" y="748" width="136" height="30" fill="#eef4fb"/>
  <text x="600" y="769" class="dimtext">55 mm MAX</text>

  <line x1="875" y1="175" x2="922" y2="175" class="ext"/>
  <line x1="875" y1="825" x2="922" y2="825" class="ext"/>
  <line x1="918" y1="195" x2="918" y2="805" class="dim"/>
  <g transform="translate(945 500) rotate(90)">
    <rect x="-59" y="-17" width="118" height="30" fill="#f7f9fc"/>
    <text x="0" y="5" class="dimtext">65 mm MAX</text>
  </g>

  <text x="28" y="960" class="note">Connector outlines are placement callouts, not manufacturing footprints. Use approved manufacturer land patterns.</text>
  <text x="28" y="980" class="note">Underlined part numbers and source references are clickable. Phoenix callouts identify both halves of each pluggable terminal block.</text>
  <text x="28" y="1000" class="note">D-sub and TE cable-side mating part numbers remain TBD. Mounting holes: Ø3.6 mm NPTH unless chassis bonding is required.</text>

  <!-- Functional requirements -->
  <line x1="40" y1="1040" x2="1160" y2="1040" class="section-rule"/>
  <text x="40" y="1080" class="section-title">Functional &amp; Main Shield Interface Requirements</text>
  <text x="40" y="1104" class="section-subtitle">New Feeling Good Blower Assembly • Single Blower Card + Arduino Mega Shield</text>

  <rect x="40" y="1130" width="535" height="115" class="function-card"/>
  <text x="64" y="1162" class="function-head">BLOWER PURPOSE</text>
  <text x="64" y="1190" class="function-body">Runs for a programmed amount of time when either the</text>
  <text x="64" y="1214" class="function-body">proximity sensor or the limit switch is triggered.</text>

  <rect x="625" y="1130" width="535" height="115" class="function-card"/>
  <text x="649" y="1162" class="function-head">LED PURPOSE</text>
  <text x="649" y="1190" class="function-body">The LED stays OFF when the blower starts. It turns ON only</text>
  <text x="649" y="1214" class="function-body">if the blower runs longer than the set limit (example: 10 min).</text>

  <rect x="40" y="1270" width="1120" height="105" class="function-card"/>
  <text x="64" y="1302" class="function-head">D-SUB PURPOSE</text>
  <text x="64" y="1330" class="function-body">Connects the sensor, limit switch, blower, and LED circuits on this card to the Main PCB Shield.</text>
  <text x="64" y="1354" class="function-body">Each shield D-sub adds all components from one Single Blower Card onto the Arduino Mega.</text>

  <rect x="40" y="1400" width="1120" height="140" class="shield-card"/>
  <text x="64" y="1433" class="shield-head">MAIN PCB SHIELD CONNECTIONS</text>
  <text x="64" y="1461" class="shield-body">• D-sub connectors for each Single Blower Card, labeled SET 1, SET 2, etc.</text>
  <text x="64" y="1487" class="shield-body">• Separate serial connection with +5V removed.</text>
  <text x="64" y="1513" class="shield-body">• Separate 12V power connection.</text>
  <rect x="755" y="1450" width="180" height="38" rx="19" fill="#2457c5"/>
  <text x="845" y="1475" class="signal-label">SERIAL: TX • RX • GND</text>
  <rect x="955" y="1450" width="170" height="38" rx="19" fill="#8b3f12"/>
  <text x="1040" y="1475" class="signal-label">POWER: +12V • GND</text>
  <text x="755" y="1513" class="tbd" text-anchor="start">+5V IS NOT CONNECTED ON THE SERIAL HEADER</text>
</svg>
